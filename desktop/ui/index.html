<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentHub</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell" aria-labelledby="page-title">
      <header class="topbar">
        <div class="brand" aria-label="AgentHub">
          <span class="brand-mark" aria-hidden="true">AH</span>
          <span>AgentHub</span>
        </div>
        <div class="topbar-actions">
          <span class="local-state"><span class="dot local" aria-hidden="true"></span>本地桌面</span>
          <button id="settings" class="icon-button" type="button" title="打开连接设置" aria-label="打开连接设置">&#9881;</button>
          <button id="refresh" class="icon-button" type="button" title="刷新状态" aria-label="刷新状态">&#8635;</button>
        </div>
      </header>

      <section class="launcher" aria-labelledby="page-title">
        <div class="launcher-copy">
          <p class="eyebrow">WORKSPACE</p>
          <h1 id="page-title">进入管理后台</h1>
          <p>任务、审批和执行证据在管理后台完成。</p>
        </div>

        <section class="launch-surface" aria-labelledby="control-plane-title">
          <div class="surface-meta">
            <span class="surface-label">MISSION CONTROL</span>
            <span id="control-state" class="state-chip missing">未配置</span>
          </div>
          <h2 id="control-plane-title">还没有连接工作区</h2>
          <p id="control-detail">完成连接配置后，从这里打开管理后台。</p>
          <button id="open-console" class="primary" type="button" disabled>
            打开管理后台 <span aria-hidden="true">&#8599;</span>
          </button>
        </section>
      </section>

      <section class="runtime-strip" aria-label="Local Runtime">
        <div class="runtime-summary">
          <span id="state-dot" class="dot stopped" aria-hidden="true"></span>
          <div>
            <p class="surface-label">LOCAL RUNTIME</p>
            <div class="runtime-line">
              <strong id="runtime-status">检查中</strong>
              <span id="runtime-readiness" class="readiness">就绪状态：检查中</span>
            </div>
            <p id="runtime-detail" class="detail">正在读取本地状态。</p>
          </div>
        </div>
        <div class="runtime-actions">
          <button id="start" class="secondary" type="button">启动</button>
          <button id="stop" class="tertiary" type="button">停止</button>
        </div>
      </section>

      <p id="feedback" class="feedback" role="status" aria-live="polite">正在检查连接状态</p>
    </main>
    <dialog id="configuration-dialog" class="configuration-dialog" aria-labelledby="configuration-title">
      <form id="configuration-form" method="dialog">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">CONNECTION</p>
            <h2 id="configuration-title">连接设置</h2>
          </div>
          <button id="close-configuration" class="icon-button" type="button" title="关闭设置" aria-label="关闭设置">&#10005;</button>
        </div>
        <p class="dialog-intro">配置管理后台和本地 Artifact 目录。凭据仅保存在系统凭据库。</p>
        <label>Mission Control 地址<input id="mission-control-endpoint" name="missionControlEndpoint" type="url" placeholder="https://control.example.com" /></label>
        <label>MCP 地址<input id="mcp-endpoint" name="mcpEndpoint" type="url" placeholder="https://mcp.example.com" /></label>
        <label>Artifact 目录<input id="artifact-directory" name="artifactDirectory" type="text" placeholder="C:\\AgentHub\\artifacts" /></label>
        <div class="secret-status" id="secret-status">凭据状态读取中</div>
        <label>Mission Control Token<input id="mission-control-token" name="missionControlToken" type="password" autocomplete="new-password" placeholder="留空以保留已保存凭据" /></label>
        <label>MCP Token<input id="mcp-token" name="mcpToken" type="password" autocomplete="new-password" placeholder="留空以保留已保存凭据" /></label>
        <label>Model API Key<input id="model-api-key" name="modelApiKey" type="password" autocomplete="new-password" placeholder="留空以保留已保存凭据" /></label>
        <div class="dialog-actions">
          <button id="cancel-configuration" class="tertiary" type="button">取消</button>
          <button id="save-configuration" class="primary" type="submit">保存设置</button>
        </div>
      </form>
    </dialog>
    <script src="./main.js"></script>
  </body>
</html>
