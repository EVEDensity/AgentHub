[package]
name = "agenthub-desktop"
version = "0.1.0"
description = "AgentHub native desktop shell"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.11.5"
url = "2"

keyring = { version = "3.6.3", features = ["windows-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
