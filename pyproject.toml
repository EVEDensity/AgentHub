[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthub-cli"
dynamic = ["version"]
description = "Local-first AgentHub developer CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "fastapi==0.115.8",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.0",
  "python-multipart==0.0.20",
  "textual==8.2.8",
  "asyncpg==0.31.0",
  "alembic==1.18.4",
  "psycopg2-binary==2.9.12",
  "httpx==0.28.1",
  "cryptography==46.0.3",
  "minio>=7.2.0,<8",
  "nats-py>=2.9.0,<3",
  "tiktoken>=0.8.0,<1",
  "tokenizers>=0.20.0,<1",
  "redis>=5.0.0,<6",
  "langgraph==0.2.74",
  "pluggy==1.5.0",
  "python-docx==1.1.2",
  "pypdf==5.1.0",
  "Pillow==12.2.0",
  "markdown==3.7",
  "python-dotenv==1.2.2",
  "rich>=13.9,<16",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
agenthub = "app.cli.entrypoint:main"

[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}

[tool.setuptools.packages.find]
include = ["app*"]
