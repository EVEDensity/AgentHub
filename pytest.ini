[pytest]
# Generated execution snapshots are evidence artifacts, not test modules.
# Keep the standard pytest exclusions while preventing recursive collection.
norecursedirs = .* build dist CVS _darcs {arch} *.egg attempt-snapshots
# These are emitted by dependency/runtime internals during schema and SQLite
# setup; keep application warnings visible while removing known test noise.
filterwarnings =
    ignore:.*Field().*serialization_alias.*:pydantic.warnings.UnsupportedFieldAttributeWarning
    ignore:.*Field().*validation_alias.*:pydantic.warnings.UnsupportedFieldAttributeWarning
    ignore:.*Field().*alias.*:pydantic.warnings.UnsupportedFieldAttributeWarning
    ignore:The default datetime adapter is deprecated as of Python 3.12:DeprecationWarning:concurrent.futures.thread
