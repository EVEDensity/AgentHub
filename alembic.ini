# AgentHub Alembic Configuration
# Database URL is read from DATABASE_URL env var (set in .env).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Database URL placeholder - resolved at runtime from DATABASE_URL env var.
# The real URL is injected in migrations/env.py via set_main_option().
sqlalchemy.url = postgresql://placeholder/for_configparser

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
