[package]
name = "retrieval-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "High-performance retrieval core: BM25 + dense + rerank fusion with evidence dedup and citation shaping for the AgentHub platform."

[lib]
path = "src/lib.rs"

[[bin]]
name = "retrieval-core-service"
path = "src/bin/retrieval-core-service.rs"

[dependencies]
platform-events = { path = "../platform-events" }

# 异步运行时
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误派生（async-nats 已间接依赖，不增加编译开销）
thiserror = "1"

# NATS 接入
async-nats = "0.33"

# HTTP 客户端（调 Qdrant / OpenSearch / model-adapter）
reqwest = { version = "0.11", features = ["json"] }

# HTTP 服务（健康检查 + 指标）
hyper = { version = "0.14", features = ["server", "http1", "runtime", "tcp"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 唯一 ID
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
