[package]
name = "agentnet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Dynamic DAG orchestration engine for decentralized multi-agent collaboration — task assignment, topology management, and capability-aware routing for the AgentHub AgentNet."

[lib]
path = "src/lib.rs"

[[bin]]
name = "agentnet-core-service"
path = "src/bin/agentnet-core-service.rs"

[dependencies]
platform-events = { path = "../platform-events" }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# NATS
async-nats = "0.33"

# HTTP server
hyper = { version = "0.14", features = ["server", "http1", "runtime", "tcp"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Unique ID
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
