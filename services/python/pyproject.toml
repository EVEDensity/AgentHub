[project]
name = "agenthub-python-services"
version = "0.1.0"
description = "Offline Python services for AgentHub platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "qdrant-client>=1.10.0",
  "opensearch-py>=2.6.0",
  "minio>=7.2.0",
  "redis>=5.0.0",
  "tenacity>=9.0.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
