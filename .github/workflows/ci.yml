name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  AGENTHUB_DB_BACKEND: sqlite
  GIT_AUTHOR_NAME: AgentHub CI
  GIT_AUTHOR_EMAIL: ci@agenthub.local
  GIT_COMMITTER_NAME: AgentHub CI
  GIT_COMMITTER_EMAIL: ci@agenthub.local
  TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tmp/ci-tokenizers/tiktoken

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.select.outputs.frontend }}
      go: ${{ steps.select.outputs.go }}
      rust: ${{ steps.select.outputs.rust }}
      windows_cli: ${{ steps.select.outputs.windows_cli }}
      docker: ${{ steps.select.outputs.docker }}
      images: ${{ steps.select.outputs.images }}
      smoke: ${{ steps.select.outputs.smoke }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve validation base
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base=$(git rev-parse HEAD^)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Select affected runtime and container checks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci_changes.py --base-ref "$BASE_SHA" --head-ref HEAD

  quality:
    name: Quality and offline benchmarks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.TIKTOKEN_CACHE_DIR }}
            assets/tokenizers/qwen
          key: tokenizers-v2-${{ runner.os }}-${{ hashFiles('scripts/ci_prepare_tokenizers.py') }}
      - run: python scripts/ci_prepare_tokenizers.py --qwen
      - name: Reject runtime syntax and name errors
        run: python -m ruff check --select E9,F63,F7,F82 app services/python scripts
      - name: Check documentation links and claim discipline
        run: |
          python benchmarks/gates.py check-links
          python benchmarks/gates.py check-docs
      - name: Reject size and complexity regressions against the base
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: python benchmarks/gates.py quality --base-ref "$BASE_SHA" --output quality-report.json
      - name: Measured offline benchmark gates
        env:
          AGENTHUB_TOKENIZER_QWEN_PATH: ${{ github.workspace }}/assets/tokenizers/qwen
          AGENTHUB_CN_TOKENIZER_PROVIDER: qwen
        run: |
          python benchmarks/gates.py run --name token_compaction_ratio
          python benchmarks/gates.py run --name streaming_ttft
          python benchmarks/gates.py run --name cn_tokenizer_precision
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: quality-report.json
          if-no-files-found: ignore

  python:
    name: Python core and CLI (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENTHUB_CLI_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            tests/contracts/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go/go.work
          cache-dependency-path: services/go/**/go.sum
      - run: python -m pip install -r requirements-dev.txt -r tests/contracts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ${{ env.TIKTOKEN_CACHE_DIR }}
          key: tiktoken-v2-${{ runner.os }}-${{ hashFiles('scripts/ci_prepare_tokenizers.py') }}
      - run: python scripts/ci_prepare_tokenizers.py
      - name: Compile production Python modules
        run: python -m compileall -q app services/python scripts
      - name: Run complete root suite, protocol contracts and real CLI subprocesses
        run: python -m pytest tests app -q --tb=short --junitxml=python-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-results
          path: python-results.xml
          if-no-files-found: ignore

  postgres:
    name: PostgreSQL migrations and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenthub_test
          POSTGRES_PASSWORD: agenthub_test
          POSTGRES_DB: agenthub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agenthub_test -d agenthub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTHUB_TEST_POSTGRES_DSN: postgresql://agenthub_test:agenthub_test@127.0.0.1:5432/agenthub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt -r tests/contracts/requirements.txt
      - run: python -m alembic heads
      - run: python -m ruff check --select E9,F63,F7,F82 tests/integration
      - name: Verify real database locks, upgrades, recovery and HTTP integration
        run: python -m pytest tests/integration -q --tb=short --junitxml=postgres-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-results
          path: postgres-results.xml
          if-no-files-found: ignore

  windows-cli:
    name: Windows CLI (3.12)
    needs: changes
    if: needs.changes.outputs.windows_cli == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      AGENTHUB_CLI_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/ci_prepare_tokenizers.py
      - name: Verify CLI, terminal and Windows release contracts
        run: python -m pytest tests/cli tests/desktop tests/npm -q --tb=short

  frontend:
    name: Frontend types, unit tests and browser flow
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      API_BACKEND: go
      GO_GATEWAY_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore

  go:
    name: Go vet and race tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go/go.work
          cache-dependency-path: services/go/**/go.sum
      - run: go work sync
      - name: Vet and test every Go module
        run: |
          while IFS= read -r mod; do
            echo "::group::$mod"
            (cd "$(dirname "$mod")" && go vet ./... && go test -short -race -count=1 ./...)
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path '*/testdata/*' | sort)

  rust:
    name: Rust workspace tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/rust
      - run: cargo test --workspace --locked

  docker:
    name: Container build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  smoke:
    name: Docker Compose health flow
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: bash scripts/ci-smoke-test.sh
      - name: Collect service logs
        if: failure()
        run: docker compose -f deploy/docker-compose.ci.yml logs --tail=200
      - name: Remove test containers
        if: always()
        run: docker compose -f deploy/docker-compose.ci.yml down -v

  gate:
    name: CI Gate
    if: always()
    needs: [changes, quality, python, postgres, windows-cli, frontend, go, rust, docker, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require successful core checks and every selected optional check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci_gate.py
