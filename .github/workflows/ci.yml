name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  AGENTHUB_DB_BACKEND: sqlite
  GIT_AUTHOR_NAME: AgentHub CI
  GIT_AUTHOR_EMAIL: ci@agenthub.local
  GIT_COMMITTER_NAME: AgentHub CI
  GIT_COMMITTER_EMAIL: ci@agenthub.local
  TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tmp/ci-tokenizers/tiktoken

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.select.outputs.frontend }}
      go: ${{ steps.select.outputs.go }}
      rust: ${{ steps.select.outputs.rust }}
      windows_cli: ${{ steps.select.outputs.windows_cli }}
      docker: ${{ steps.select.outputs.docker }}
      images: ${{ steps.select.outputs.images }}
      smoke: ${{ steps.select.outputs.smoke }}
      opensandbox: ${{ steps.select.outputs.opensandbox }}
      browser_read: ${{ steps.select.outputs.browser_read }}
      desktop_package: ${{ steps.select.outputs.desktop_package }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve validation base
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base=$(git rev-parse HEAD^)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Select affected runtime and container checks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci_changes.py --base-ref "$BASE_SHA" --head-ref HEAD

  quality:
    name: Quality and offline benchmarks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.TIKTOKEN_CACHE_DIR }}
            assets/tokenizers/qwen
          key: tokenizers-v2-${{ runner.os }}-${{ hashFiles('scripts/ci_prepare_tokenizers.py') }}
      - run: python scripts/ci_prepare_tokenizers.py --qwen
      - name: Reject runtime syntax and name errors
        run: python -m ruff check --select E9,F63,F7,F82 app services/python scripts
      - name: Check documentation links and claim discipline
        run: |
          python benchmarks/gates.py check-links
          python benchmarks/gates.py check-docs
      - name: Reject size and complexity regressions against the base
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: python benchmarks/gates.py quality --base-ref "$BASE_SHA" --output quality-report.json
      - name: Measured offline benchmark gates
        env:
          AGENTHUB_TOKENIZER_QWEN_PATH: ${{ github.workspace }}/assets/tokenizers/qwen
          AGENTHUB_CN_TOKENIZER_PROVIDER: qwen
        run: |
          python benchmarks/gates.py run --name token_compaction_ratio
          python benchmarks/gates.py run --name streaming_ttft
          python benchmarks/gates.py run --name cn_tokenizer_precision
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: quality-report.json
          if-no-files-found: ignore

  python:
    name: Python core and CLI (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENTHUB_CLI_E2E: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            tests/contracts/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go/go.work
          cache-dependency-path: services/go/**/go.sum
      - run: python -m pip install -r requirements-dev.txt -r tests/contracts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ${{ env.TIKTOKEN_CACHE_DIR }}
          key: tiktoken-v2-${{ runner.os }}-${{ hashFiles('scripts/ci_prepare_tokenizers.py') }}
      - run: python scripts/ci_prepare_tokenizers.py
      - name: Compile production Python modules
        run: python -m compileall -q app services/python scripts
      - name: Run complete root suite, protocol contracts and real CLI subprocesses
        run: python -m pytest tests app -q --tb=short --junitxml=python-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-results
          path: python-results.xml
          if-no-files-found: ignore

  postgres:
    name: PostgreSQL migrations and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenthub_test
          POSTGRES_PASSWORD: agenthub_test
          POSTGRES_DB: agenthub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agenthub_test -d agenthub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTHUB_TEST_POSTGRES_DSN: postgresql://agenthub_test:agenthub_test@127.0.0.1:5432/agenthub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt -r tests/contracts/requirements.txt
      - run: python -m alembic heads
      - run: python -m ruff check --select E9,F63,F7,F82 tests/integration
      - name: Verify real database locks, upgrades, recovery and HTTP integration
        run: python -m pytest tests/integration -q --tb=short --junitxml=postgres-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-results
          path: postgres-results.xml
          if-no-files-found: ignore

  windows-cli:
    name: Windows CLI (3.12)
    needs: changes
    if: needs.changes.outputs.windows_cli == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      AGENTHUB_CLI_E2E: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify desktop preview boundaries and PowerShell compatibility
        run: node --test desktop/tests/shell-browser-smoke.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt -r tests/contracts/requirements.txt
      - run: python scripts/ci_prepare_tokenizers.py
      - name: Verify CLI, terminal and Windows release contracts
        run: python -m pytest tests/cli tests/desktop tests/npm -q --tb=short
      - name: Verify trusted-local snapshots, subprocess cleanup and test production
        run: >-
          python -m pytest tests/services/test_trusted_test_snapshot.py
          tests/services/test_trusted_test_producer.py tests/services/test_trusted_test_harness.py
          tests/services/test_trusted_test_process.py -q --tb=short
      - name: Verify strict provider HTTP accounting and Native Harness composition
        run: >-
          python -m pytest tests/services/test_strict_provider_http.py
          tests/services/test_strict_provider_wire.py tests/services/test_strict_provider_fences.py
          tests/services/test_strict_budget_harness.py
          tests/services/test_harness_model_operations.py
          tests/integration/test_strict_budget_runner_sqlite.py -q --tb=short
      - name: Verify experimental Native sandbox composition contracts
        run: >-
          python -m pytest tests/services/test_opensandbox_harness.py
          tests/services/test_opensandbox_harness_supervision.py
          tests/services/test_opensandbox_native_factory.py
          tests/integration/test_opensandbox_native_sqlite.py -q --tb=short
      - name: Verify frozen reviewed Skills and progressive Native reads
        run: >-
          python -m pytest tests/services/test_reviewed_skill_catalog.py
          tests/services/test_reviewed_skill_tools.py
          tests/services/test_reviewed_desktop_skills.py
          tests/services/test_desktop_skill_tools.py
          tests/contracts/test_reviewed_skill_packages.py
          tests/integration/test_reviewed_skills_runner_sqlite.py -q --tb=short
      - name: Verify browser profile, wire and Native composition contracts
        run: >-
          python -m pytest tests/services/test_browser_read_profile.py
          tests/services/test_browser_read_backend.py tests/services/test_browser_read_cleanup.py
          tests/services/test_browser_read_workdir.py
          tests/services/test_browser_read_harness.py tests/services/test_browser_native_factory.py
          tests/contracts/test_browser_execution_report.py -q --tb=short

  desktop-package:
    name: Windows full-package resources
    needs: changes
    if: needs.changes.outputs.desktop_package == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go/go.work
          cache-dependency-path: services/go/**/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/runtime-sidecar/target
            desktop/src-tauri/target
          key: desktop-resources-${{ runner.os }}-${{ hashFiles('desktop/**/Cargo.lock') }}-tauri-2.11.4
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - name: Verify resource rejection boundaries
        run: node --test desktop/tests/*.test.mjs
      - name: Require unchanged committed build inputs
        shell: pwsh
        run: |
          $changes = @(git status --porcelain --untracked-files=normal)
          if ($LASTEXITCODE -ne 0 -or $changes.Count) { throw "Build preparation changed source inputs: $($changes -join '; ')" }
      - uses: actions/cache/restore@v4
        id: tauri_cli_cache
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-2.11.4-rust-1.88.0
      - name: Prepare pinned build tools
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw 'Python freeze dependencies failed to install.' }
          if ((cargo tauri --version 2>$null) -ne 'tauri-cli 2.11.4') { cargo install tauri-cli --version 2.11.4 --locked --force }
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Tauri CLI installation failed.' }
      - uses: actions/cache/save@v4
        if: steps.tauri_cli_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: ${{ steps.tauri_cli_cache.outputs.cache-primary-key }}
      - name: Build one current full stack and verify actual Portable and MSI
        shell: pwsh
        run: desktop/package-windows.ps1 -TargetTriple x86_64-pc-windows-msvc -LocalServices
      - name: Require both actual package reports
        shell: pwsh
        run: desktop/require-package-resource-reports.ps1 -Directory desktop/.runtime/package-resources -SourceCommit '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-package-resources
          path: desktop/.runtime/package-resources/
          if-no-files-found: error

  frontend:
    name: Frontend, editor contracts and browser flow
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      API_BACKEND: go
      GO_GATEWAY_URL: http://localhost:8081
      MISSION_CONTROL_URL: http://127.0.0.1:38100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install real Artifact browser fixture dependencies
        run: python -m pip install -r ../requirements-dev.txt -r ../tests/contracts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            extensions/vscode-agenthub/package-lock.json
      - name: Install editor extension dependencies
        run: npm ci
        working-directory: extensions/vscode-agenthub
      - name: Compile and verify editor API contracts
        run: npm test
        working-directory: extensions/vscode-agenthub
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - name: Verify desktop shell-preview harness boundaries
        run: node --test ../desktop/tests/shell-browser-smoke.test.mjs
      - name: Run desktop shell browser preview (not native WebView2)
        run: node ../desktop/shell-browser-smoke.mjs --port 0 --output-directory ../.tmp/desktop-shell-browser-preview
      - name: Require classified browser-preview report and real screenshots
        run: >-
          python -c "import json; from pathlib import Path;
          reports=list(Path('../.tmp/desktop-shell-browser-preview').glob('shell-browser-preview-*/report.json'));
          assert len(reports)==1;
          p=reports[0]; r=json.loads(p.read_text(encoding='utf-8'));
          assert r['schemaVersion']==1 and r['scope']=='browser-shell-preview' and r['status']=='passed';
          assert all(r[k] is False for k in ('nativeWebView2','packagedApplication','realServicesVerified'));
          assert r['playwrightVersion']=='1.61.1' and len(r['checks'])==3;
          shots=[Path(v) for v in r['screenshots'].values()];
          assert len(shots)==3 and all(s.resolve().is_relative_to(p.parent.resolve()) and s.is_file() and s.stat().st_size>0 for s in shots)"
      - run: npx playwright test --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: .tmp/frontend-playwright.xml
      - name: Require real Artifact preview browser coverage without skips
        run: >-
          python -c "import xml.etree.ElementTree as E;
          cases=[c for c in E.parse('.tmp/frontend-playwright.xml').getroot().iter('testcase') if 'artifact-preview.spec.ts' in c.get('classname','')];
          assert len(cases) >= 5;
          assert all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases)"
      - name: Require real Mission assistant browser coverage without skips
        run: >-
          python -c "import xml.etree.ElementTree as E;
          cases=[c for c in E.parse('.tmp/frontend-playwright.xml').getroot().iter('testcase') if 'mission-chat.spec.ts' in c.get('classname','')];
          assert len(cases) >= 11;
          assert all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases)"
      - name: Require real native Session restoration browser coverage without skips
        run: >-
          python -c "import xml.etree.ElementTree as E;
          cases=[c for c in E.parse('.tmp/frontend-playwright.xml').getroot().iter('testcase') if 'native-mission-sessions.spec.ts' in c.get('classname','')];
          assert len(cases) >= 11;
          assert all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases)"
      - name: Require real registered log browser coverage without skips
        run: >-
          python -c "import xml.etree.ElementTree as E;
          cases=[c for c in E.parse('.tmp/frontend-playwright.xml').getroot().iter('testcase') if 'artifact-log.spec.ts' in c.get('classname','')];
          assert len(cases) >= 7;
          assert all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases)"
      - name: Require honest admin header browser coverage without skips
        run: >-
          python -c "import xml.etree.ElementTree as E;
          cases=[c for c in E.parse('.tmp/frontend-playwright.xml').getroot().iter('testcase') if 'admin-header.spec.ts' in c.get('classname','')];
          assert len(cases) >= 3;
          assert all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-results
          path: frontend/.tmp/frontend-playwright.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore
      - name: Upload desktop browser-preview evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-shell-browser-preview
          path: .tmp/desktop-shell-browser-preview/
          if-no-files-found: error

  go:
    name: Go vet and race tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go/go.work
          cache-dependency-path: services/go/**/go.sum
      - run: go work sync
      - name: Vet and test every Go module
        run: |
          while IFS= read -r mod; do
            echo "::group::$mod"
            (cd "$(dirname "$mod")" && go vet ./... && go test -short -race -count=1 ./...)
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path '*/testdata/*' | sort)
      - name: Build the real sandbox execution image
        working-directory: ${{ github.workspace }}
        run: docker build -t agenthub/sandbox:ci -f deploy/sandbox-image/Dockerfile deploy/sandbox-image
      - name: Verify real Docker execution and cancellation
        working-directory: services/go/sandbox-service
        env:
          AGENTHUB_TEST_DOCKER: '1'
          AGENTHUB_TEST_DOCKER_IMAGE: agenthub/sandbox:ci
        run: go test -v -race -count=1 -timeout=120s -run '^TestLiveDocker' ./...

  rust:
    name: Rust workspace tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/rust
      - run: cargo test --workspace --locked

  docker:
    name: Container build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  smoke:
    name: Docker Compose health flow
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: bash scripts/ci-smoke-test.sh
      - name: Collect service logs
        if: failure()
        run: docker compose -f deploy/docker-compose.ci.yml logs --tail=200
      - name: Remove test containers
        if: always()
        run: docker compose -f deploy/docker-compose.ci.yml down -v

  opensandbox:
    name: OpenSandbox pinned Linux conformance
    needs: changes
    if: needs.changes.outputs.opensandbox == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt
      - name: Require real pinned sandbox execution, cancellation and cleanup
        run: python scripts/opensandbox_poc_ci.py --enable --native-composition --report .tmp/opensandbox-ci/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opensandbox-conformance
          path: |
            .tmp/opensandbox-ci/report.json
            .tmp/opensandbox-ci/report.infrastructure.json
            .tmp/opensandbox-ci/report.native.json
          if-no-files-found: error

  browser-read:
    name: Playwright anonymous read Linux conformance
    needs: changes
    if: needs.changes.outputs.browser_read == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGENTHUB_REAL_BROWSER: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/node/browser-read/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
        working-directory: services/node/browser-read
      - uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: browser-read-${{ runner.os }}-${{ hashFiles('services/node/browser-read/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: services/node/browser-read
      - run: npm test
        working-directory: services/node/browser-read
      - name: Require real Chromium, cancellation, deadlines and Runner integrity flow
        run: >-
          python -m pytest tests/integration/test_browser_read_live.py
          tests/integration/test_browser_native_runner_sqlite.py
          -q --tb=short --junitxml=.tmp/browser-read-results.xml
      - name: Reject skipped or empty enabled browser conformance
        run: >-
          python -c "import xml.etree.ElementTree as E;
          suites=list(E.parse('.tmp/browser-read-results.xml').getroot().iter('testsuite'));
          assert suites and sum(int(s.get('tests','0')) for s in suites) >= 8;
          assert all(int(s.get('skipped','0')) == 0 for s in suites)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-read-conformance
          path: .tmp/browser-read-results.xml
          if-no-files-found: error

  gate:
    name: CI Gate
    if: always()
    needs: [changes, quality, python, postgres, windows-cli, desktop-package, frontend, go, rust, docker, smoke, opensandbox, browser-read]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require successful core checks and every selected optional check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci_gate.py
