name: Public contracts

on:
  push:
    paths:
      - "platform/contracts/v1/**"
      - "app/domain/**"
      - "app/compat/**"
      - "app/db/migrations/**"
      - "app/db/init_db.py"
      - "app/repositories/**"
      - "migrations/versions/**"
      - "tests/contracts/**"
      - "tests/compat/**"
      - "tests/domain/**"
      - "tests/persistence/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "platform/contracts/v1/**"
      - "app/domain/**"
      - "app/compat/**"
      - "app/db/migrations/**"
      - "app/db/init_db.py"
      - "app/repositories/**"
      - "migrations/versions/**"
      - "tests/contracts/**"
      - "tests/compat/**"
      - "tests/domain/**"
      - "tests/persistence/**"
      - ".github/workflows/contracts.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/contracts/requirements.txt
      - run: pip install -r tests/contracts/requirements.txt
      - run: python -m unittest discover -s tests/contracts -p "test_*.py" -v
      - run: python -m unittest discover -s tests/compat -p "test_*.py" -v
      - run: python -m unittest discover -s tests/domain -p "test_*.py" -v
      - run: python -m unittest discover -s tests/persistence -p "test_*.py" -v
