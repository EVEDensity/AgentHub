# ─────────────────────────────────────────────────────────────────────
# AgentHub Platform — full stack (infra + Go online tier + Python offline
# tier + Rust cores + observability). Bring up with:
#   docker compose -f deploy/docker-compose.platform.yml up --build
# ─────────────────────────────────────────────────────────────────────

x-go-env: &go-env
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4318"
  NATS_URL: "nats://nats:4222"
  REDIS_ADDR: "redis:6379"
  DATABASE_DSN: "postgres://agenthub:agenthub@postgres:5432/agenthub?sslmode=disable"

services:
  # ═══════════════════════════════════════════════════════════════════
  #  INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════════
  redis:
    image: redis:7.2
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6389:6379"]

  nats:
    image: nats:2.10
    command: ["-js"]
    ports: ["4222:4222", "8222:8222"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub
      POSTGRES_DB: agenthub
    ports: ["5435:5432"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]

  # ═══════════════════════════════════════════════════════════════════
  #  Milvus — 分布式向量数据库（可选，默认不启用）
  #  ─────────────────────────────────────────────────────────────────
  #  启用方式：docker compose -f deploy/docker-compose.platform.yml --profile milvus up
  #  适用场景：向量规模 > 1000 万条、需要分布式部署、多索引类型
  #  当前推荐：保留 Qdrant（轻量、Rust 实现、单机友好、API 简洁）
  #  迁移评估点：见 docs/operations/migrations/vector-db-migration-checklist.md
  # ═══════════════════════════════════════════════════════════════════
  # milvus-etcd:
  #   profiles: ["milvus"]
  #   image: quay.io/coreos/etcd:v3.5.5
  #   environment:
  #     ETCD_AUTO_COMPACTION_MODE: revision
  #     ETCD_AUTO_COMPACTION_RETENTION: "1000"
  #     ETCD_QUOTA_BACKEND_BYTES: "4294967296"
  #   volumes:
  #     - milvus-etcd-data:/etcd
  #   command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
  #
  # milvus-minio:
  #   profiles: ["milvus"]
  #   image: minio/minio:latest
  #   environment:
  #     MINIO_ACCESS_KEY: minioadmin
  #     MINIO_SECRET_KEY: minioadmin
  #   volumes:
  #     - milvus-minio-data:/minio_data
  #   command: minio server /minio_data
  #
  # milvus:
  #   profiles: ["milvus"]
  #   image: milvusdb/milvus:v2.4.0
  #   command: ["milvus", "run", "standalone"]
  #   environment:
  #     ETCD_ENDPOINTS: milvus-etcd:2379
  #     MINIO_ADDRESS: milvus-minio:9000
  #   depends_on: [milvus-etcd, milvus-minio]
  #   ports: ["19530:19530", "9091:9091"]
  #   volumes:
  #     - milvus-data:/var/lib/milvus

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]

  # ═══════════════════════════════════════════════════════════════════
  #  OBSERVABILITY
  # ═══════════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./agenthub_rules.yml:/etc/prometheus/agenthub_rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports: ["9090:9090"]

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yaml:ro
    ports: ["3200:3200", "4318:4318"]   # 4318 = OTLP/HTTP

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus, tempo, loki]

  # Sprint J4: Loki centralized logging — log aggregation.
  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on: [loki]

  # Sprint K3: Alertmanager — centralized alert routing with P0-P3 severity.
  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./agenthub_alerts.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.external-url=http://localhost:9093"
    ports: ["9093:9093"]
    depends_on: [prometheus]

  # ═══════════════════════════════════════════════════════════════════
  #  GO ONLINE TIER
  # ═══════════════════════════════════════════════════════════════════
  gateway-service:
    build:
      context: ..
      dockerfile: services/go/gateway-service/Dockerfile
    environment:
      <<: *go-env
      GATEWAY_ADDR: ":8081"
      JWT_SECRET: "${JWT_SECRET:-}"
    depends_on: [nats, tempo]
    ports: ["8081:8081"]

  realtime-orchestrator:
    build:
      context: ..
      dockerfile: services/go/realtime-orchestrator/Dockerfile
    environment:
      <<: *go-env
      ORCHESTRATOR_ADDR: ":8082"
      MODEL_ADAPTER_URL: "http://model-adapter-service:8091"
      RETRIEVAL_CORE_URL: "http://retrieval-core:8102"
    depends_on: [nats, redis, model-adapter-service, retrieval-core, tempo]
    ports: ["8082:8082"]

  session-service:
    build:
      context: ..
      dockerfile: services/go/session-service/Dockerfile
    environment:
      <<: *go-env
      SESSION_ADDR: ":8083"
      STREAM_DELIVERY_URL: "http://stream-delivery-service:8086"
    depends_on: [redis, postgres, stream-delivery-service, tempo]
    ports: ["8083:8083"]

  tool-permission-service:
    build:
      context: ..
      dockerfile: services/go/tool-permission-service/Dockerfile
    environment:
      <<: *go-env
      PERMISSION_ADDR: ":8084"
    depends_on: [redis, postgres, nats, tempo]
    ports: ["8084:8084"]

  agent-runtime-control-plane:
    build:
      context: ..
      dockerfile: services/go/agent-runtime-control-plane/Dockerfile
    environment:
      <<: *go-env
      RUNTIME_ADDR: ":8085"
      MODEL_ADAPTER_URL: "http://model-adapter-service:8091"
    depends_on: [nats, tempo, model-adapter-service]
    ports: ["8085:8085"]

  stream-delivery-service:
    build:
      context: ..
      dockerfile: services/go/stream-delivery-service/Dockerfile
    environment:
      <<: *go-env
      DELIVERY_ADDR: ":8086"
    depends_on: [nats, redis, tempo]
    ports: ["8086:8086"]

  audit-log-service:
    build:
      context: ..
      dockerfile: services/go/audit-log-service/Dockerfile
    environment:
      <<: *go-env
      AUDIT_ADDR: ":8087"
    depends_on: [nats, postgres, tempo]
    ports: ["8087:8087"]

  iam-service:
    build:
      context: ..
      dockerfile: services/go/iam-service/Dockerfile
    environment:
      <<: *go-env
      IAM_ADDR: ":8088"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_TTL: "24h"
    depends_on: [postgres, tempo]
    ports: ["8088:8088"]

  sandbox-service:
    build:
      context: ..
      dockerfile: services/go/sandbox-service/Dockerfile
    environment:
      <<: *go-env
      SANDBOX_ADDR: ":8097"
      SANDBOX_IMAGE: "${SANDBOX_IMAGE:-agenthub/sandbox:latest}"
      SANDBOX_CPU_LIMIT: "${SANDBOX_CPU_LIMIT:-1.0}"
      SANDBOX_MEMORY_MB: "${SANDBOX_MEMORY_MB:-512}"
      SANDBOX_NETWORK_ALLOW: "${SANDBOX_NETWORK_ALLOW:-none}"
      SANDBOX_OUTPUT_SANITIZE_LEVEL: "${SANDBOX_OUTPUT_SANITIZE_LEVEL:-basic}"
      SANDBOX_SECCOMP_PROFILE: "${SANDBOX_SECCOMP_PROFILE:-/etc/agenthub/seccomp.json}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./sandbox-image/seccomp.json:/etc/agenthub/seccomp.json:ro
    depends_on: [tempo]
    ports: ["8097:8097"]

  # ═══════════════════════════════════════════════════════════════════
  #  FRONTEND
  # ═══════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      GO_GATEWAY_URL: "http://gateway-service:8081"
      API_BACKEND: "legacy"
      API_BACKEND_URL: "http://host.docker.internal:8000"
    depends_on: [gateway-service]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["3000:3000"]

  # ═══════════════════════════════════════════════════════════════════
  #  PYTHON OFFLINE TIER
  # ═══════════════════════════════════════════════════════════════════
  offline-knowledge-service:
    build:
      context: ..
      dockerfile: services/python/offline_knowledge_service/Dockerfile
    environment:
      # 下游存储
      QDRANT_URL: "http://qdrant:6333"
      OPENSEARCH_URL: "http://opensearch:9200"
      MINIO_ENDPOINT: "minio:9000"
      # 事件总线
      NATS_URL: "nats://nats:4222"
      # embedding 模型（通过 model-adapter /v1/embeddings 调用）
      MODEL_ADAPTER_URL: "http://model-adapter-service:8091"
      EMBEDDING_MODEL: "bge-large-zh-v1.5"
      # 分块参数
      CHUNK_SIZE: "512"
      CHUNK_OVERLAP: "64"
      EMBEDDING_BATCH_SIZE: "32"
      MAX_CHUNKS_PER_INGEST: "2048"
    depends_on: [qdrant, opensearch, minio, nats, model-adapter-service]
    ports: ["8092:8092"]

  model-adapter-service:
    build:
      context: ..
      dockerfile: services/python/model_adapter_service/Dockerfile
    ports: ["8091:8091"]

  summarization-service:
    build:
      context: ..
      dockerfile: services/python/summarization_service/Dockerfile
    environment:
      NATS_URL: "nats://nats:4222"
    depends_on: [nats]
    ports: ["8093:8093"]

  evaluation-batch-service:
    build:
      context: ..
      dockerfile: services/python/evaluation_batch_service/Dockerfile
    environment:
      NATS_URL: "nats://nats:4222"
    depends_on: [nats]
    ports: ["8094:8094"]

  document-pipeline-service:
    build:
      context: ..
      dockerfile: services/python/document_pipeline_service/Dockerfile
    environment:
      # 事件总线
      NATS_URL: "nats://nats:4222"
      # MinIO 对象存储
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minio"
      MINIO_SECRET_KEY: "minio123"
      MINIO_BUCKET: "agenthub"
      MINIO_SECURE: "false"
      # 抽取限制
      MAX_EXTRACT_CHARS: "500000"
    depends_on: [nats, minio]
    ports: ["8095:8095"]

  # ═══════════════════════════════════════════════════════════════════
  #  RUST HIGH-PERFORMANCE CORES
  # ═══════════════════════════════════════════════════════════════════
  stream-core:
    build:
      context: ..
      dockerfile: services/rust/crates/stream-core/Dockerfile
    environment:
      NATS_URL: "nats://nats:4222"
      STREAM_CORE_ADDR: "0.0.0.0:8101"
      RUST_LOG: "info,stream_core=info"
      # chunk 合并策略：12 个 chunk / 120ms / 8KB 触发 flush
      SC_FLUSH_MAX_CHUNKS: "12"
      SC_FLUSH_MAX_INTERVAL_MS: "120"
      SC_FLUSH_MAX_BYTES: "8192"
      # 背压窗口：1024 容量，满时丢弃最旧
      SC_BP_CAPACITY: "1024"
      SC_BP_POLICY: "drop_oldest"
      # 慢消费者降级：64 容量，lag>16 触发，丢弃最旧，90s 无 drain 回收
      SC_CONSUMER_CAPACITY: "64"
      SC_CONSUMER_LAG_THRESHOLD: "16"
      SC_CONSUMER_POLICY: "drop_oldest"
      SC_CONSUMER_IDLE_TIMEOUT_SECS: "90"
    depends_on: [nats, tempo]
    ports: ["8101:8101"]

  retrieval-core:
    build:
      context: ..
      dockerfile: services/rust/crates/retrieval-core/Dockerfile
    environment:
      NATS_URL: "nats://nats:4222"
      RETRIEVAL_CORE_ADDR: "0.0.0.0:8102"
      RUST_LOG: "info,retrieval_core=info"
      # 下游依赖
      QDRANT_URL: "http://qdrant:6333"
      OPENSEARCH_URL: "http://opensearch:9200"
      MODEL_ADAPTER_URL: "http://model-adapter-service:8091"
      EMBEDDING_MODEL: "bge-large-zh-v1.5"
      # 超时（单源 500ms / embedding 300ms / rerank 400ms）
      RC_SOURCE_TIMEOUT_MS: "500"
      RC_EMBEDDING_TIMEOUT_MS: "300"
      RC_RERANK_TIMEOUT_MS: "400"
      RC_HTTP_TIMEOUT_MS: "2000"
      # rerank：取 top-20 候选送精排，默认开启（model-adapter 未实现时自动降级）
      RC_RERANK_ENABLED: "true"
      RC_RERANK_TOP_N: "20"
      # 融合：RRF k=60，freshness 半衰期 30 天，每源拉 50 条
      RC_FUSION_RRF_K: "60"
      RC_FUSION_FRESHNESS_HALF_LIFE_DAYS: "30"
      RC_FUSION_PER_SOURCE_LIMIT: "50"
    depends_on: [nats, qdrant, opensearch, model-adapter-service, tempo]
    ports: ["8102:8102"]

  fanout-core:
    build:
      context: ..
      dockerfile: services/rust/crates/fanout-core/Dockerfile
    environment:
      NATS_URL: "nats://nats:4222"
      FANOUT_CORE_ADDR: "0.0.0.0:8103"
      RUST_LOG: "info,fanout_core=info"
      # 分区：初始 8 个，最大 32，每分区 1000 事件触发扩容
      FC_INITIAL_PARTITIONS: "8"
      FC_MAX_PARTITIONS: "32"
      FC_PARTITION_SCALE_THRESHOLD: "1000"
      # 订阅者：256 容量，lag 超限时丢弃最旧消息
      FC_SUBSCRIBER_CAPACITY: "256"
      FC_SLOW_SUBSCRIBER_POLICY: "drop_oldest"
    depends_on: [nats, tempo]
    ports: ["8103:8103"]

  patch-merge-core:
    build:
      context: ..
      dockerfile: services/rust/crates/patch-merge-core/Dockerfile
    environment:
      NATS_URL: "nats://nats:4222"
      PATCH_MERGE_CORE_ADDR: "0.0.0.0:8104"
      RUST_LOG: "info,patch_merge_core=info"
      # 文本上限 8 MiB，diff/patch/merge 操作上限 200000 条
      PMC_MAX_TEXT_BYTES: "8388608"
      PMC_MAX_OPS: "200000"
    depends_on: [nats, tempo]
    ports: ["8104:8104"]

  memory-segment-core:
    build:
      context: ..
      dockerfile: services/rust/crates/memory-segment-core/Dockerfile
    environment:
      NATS_URL: "nats://nats:4222"
      MEMORY_SEGMENT_CORE_ADDR: "0.0.0.0:8105"
      RUST_LOG: "info,memory_segment_core=info"
      # 压缩触发：40 条消息 或 32000 tokens
      MSC_COMPACT_TRIGGER_MESSAGES: "40"
      MSC_MAX_TOKENS: "32000"
      # 保留最近 10 条原消息，4 字符 ≈ 1 token
      MSC_KEEP_RECENT: "10"
      MSC_CHARS_PER_TOKEN: "4.0"
    depends_on: [nats, tempo]
    ports: ["8105:8105"]

  # ═══════════════════════════════════════════════════════════════════
  #  vLLM — 本地推理服务（可选，默认不启用）
  #  ─────────────────────────────────────────────────────────────────
  #  启用方式：docker compose -f deploy/docker-compose.platform.yml --profile vllm up
  #  GPU 要求：8GB+ VRAM（推荐 T4/A10/A100），CPU 模式仅用于功能验证
  #  部署文档：见 docs/operations/deployment/vllm.md
  #  调用方式：model 字段传 vllm-<hf-model-id>，如 vllm-Qwen/Qwen2.5-7B-Instruct
  # ═══════════════════════════════════════════════════════════════════
  vllm:
    profiles: ["vllm"]  # 默认不启动，需显式 --profile vllm
    image: vllm/vllm-openai:latest
    # ── GPU 模式（生产推荐）──────────────────────────────────────────
    # 取消下方 deploy 段注释以启用 GPU（需 Docker with NVIDIA Container Toolkit）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # ── CPU 模式（仅功能验证，性能差）────────────────────────────────
    # 不配置 deploy 段即 CPU 模式
    environment:
      # 模型 HF ID 或本地路径
      VLLM_MODEL: "${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}"
      # HuggingFace Hub Token（拉取私有/gated 模型时需要）
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
      # vLLM 服务 API Key（model-adapter 通过 VLLM_API_KEY 传入）
      VLLM_API_KEY: "${VLLM_API_KEY:-not-needed}"
      # 张量并行度（GPU 数）
      VLLM_TENSOR_PARALLEL_SIZE: "${VLLM_TENSOR_PARALLEL_SIZE:-1}"
      # 最大序列长度
      VLLM_MAX_MODEL_LEN: "${VLLM_MAX_MODEL_LEN:-8192}"
      # GPU 内存利用率（0.0-1.0）
      VLLM_GPU_MEMORY_UTILIZATION: "${VLLM_GPU_MEMORY_UTILIZATION:-0.9}"
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.9}
      --trust-remote-code
    ports: ["8106:8000"]   # 8106 是预留端口，vLLM 内部固定 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s   # 模型加载慢，给 2 分钟缓冲

# ── Named volumes ──────────────────────────────────────────────────────
volumes:
  loki-data:
